<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Translator Tool - Powered by Shivam</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            background-image: url('https://images.unsplash.com/photo-1524492412937-b28074a5d7da?q=80&w=2071&auto=format&fit=crop'); 
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover; 
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative; 
            overflow-x: hidden; 
        }
        
        .corner-logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 80px; 
            height: auto;
            border-radius: 8px; 
            background: white; 
            padding: 5px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95); 
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            padding: 30px;
            margin: auto; 
            transition: filter 0.3s; 
            z-index: 10;
        }

        .time-display {
            text-align: center;
            font-size: 16px;
            color: #000080;
            font-weight: bold;
            margin-bottom: 15px;
            background: #e8f0fe;
            padding: 8px;
            border-radius: 6px;
            display: inline-block;
        }
        .time-container {
            text-align: center;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7); 
            z-index: 1000;
            display: flex; 
            justify-content: center;
            align-items: center;
            visibility: visible; 
            opacity: 1;
            transition: visibility 0.3s, opacity 0.3s;
        }
        .modal-content {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
            padding: 40px;
            text-align: center;
            position: relative;
        }
        .modal-content h3 {
            font-size: 26px;
            color: #ff9933; 
            margin-bottom: 15px;
        }
        .modal-content p {
            font-size: 18px;
            color: #138808; 
            font-weight: bold;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .modal-ok-btn {
            padding: 14px 40px;
            background-color: #000080; 
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        .modal-ok-btn:hover {
            background-color: #000050;
        }
        .modal-ok-btn:active {
            transform: scale(0.98);
        }

        .disable-interaction {
            filter: blur(4px);
            pointer-events: none;
        }
        .hide-modal {
            visibility: hidden;
            opacity: 0;
        }

        .footer {
            width: 100%;
            text-align: center;
            padding: 15px;
            position: fixed;
            bottom: 0;
            left: 0;
            background-color: rgba(255, 255, 255, 0.9); 
            border-top: 1px solid #ddd;
            z-index: 900;
        }
        .footer p {
            color: #555;
            font-size: 14px;
            font-weight: bold;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        .wrapper {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
            outline: none;
            background-color: #f9f9f9;
        }
        textarea {
            resize: none;
            height: 200px;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            outline: none;
        }
        textarea:focus {
            border-color: #000080;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: #555;
            transition: color 0.2s;
        }
        .icon-btn:hover {
            color: #000080;
        }
        .translate-btn {
            width: 100%;
            padding: 14px;
            background-color: #000080;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .translate-btn:hover {
            background-color: #000050;
        }
        @media (max-width: 600px) {
            .wrapper {
                flex-direction: column;
            }
            .corner-logo {
                width: 50px;
                top: 10px;
                left: 10px;
            }
        }
    </style>
</head>
<body id="page-body">

    <img src="https://cdn-icons-png.flaticon.com/512/281/281759.png" alt="Corner Logo" class="corner-logo">
    
    <div class="modal-overlay" id="welcome-modal">
        <div class="modal-content">
            <h3>WELCOME TO SHIVAM Engineer WEBSITE</h3>
            <p>सत्यमेव जयते, थैंक यू इंडिया <br> Thank you for visiting!</p>
            <button class="modal-ok-btn" id="modal-ok">OK</button>
        </div>
    </div>
    
    <div class="container disable-interaction" id="main-content">
        <h2>🌐 Indian Language Translator </h2>
        
        <div class="time-container">
            <div class="time-display" id="live-time">Loading time...</div>
        </div>
        
        <div class="wrapper">
            <div class="box">
                <select id="source-lang">
                    <option value="en-GB">English</option>
                    <option value="hi-IN">Hindi (हिंदी)</option>
                    <option value="ur-PK">Urdu (اردو)</option>
                    <option value="bn-IN">Bengali (বাংলা)</option>
                    <option value="mr-IN">Marathi (मराठी)</option>
                    <option value="te-IN">Telugu (తెలుగు)</option>
                    <option value="ta-IN">Tamil (தமிழ்)</option>
                    <option value="gu-IN">Gujarati (ગુજરાતી)</option>
                    <option value="kn-IN">Kannada (ಕನ್ನಡ)</option>
                    <option value="ml-IN">Malayalam (മലയാളം)</option>
                    <option value="pa-IN">Punjabi (ਪੰਜਾਬੀ)</option>
                    <option value="sa-IN">Sanskrit (संस्कृतम्)</option>
                    <option value="es-ES">Spanish</option>
                    <option value="fr-FR">French</option>
                    <option value="ar-SA">Arabic</option>
                </select>
                <textarea id="input-text" placeholder="Enter text here..."></textarea>
                <div class="controls">
                    <button class="icon-btn" id="speak-source" title="Listen">🔊</button>
                </div>
            </div>

            <div class="box">
                <select id="target-lang">
                    <option value="hi-IN">Hindi (हिंदी)</option>
                    <option value="en-GB">English</option>
                    <option value="ur-PK">Urdu (اردو)</option>
                    <option value="bn-IN">Bengali (বাংলা)</option>
                    <option value="mr-IN">Marathi (मराठी)</option>
                    <option value="te-IN">Telugu (తెలుగు)</option>
                    <option value="ta-IN">Tamil (தமிழ்)</option>
                    <option value="gu-IN">Gujarati (ગુજરાતી)</option>
                    <option value="kn-IN">Kannada (ಕನ್ನಡ)</option>
                    <option value="ml-IN">Malayalam (മലയാളം)</option>
                    <option value="pa-IN">Punjabi (ਪੰਜਾਬੀ)</option>
                    <option value="sa-IN">Sanskrit (संस्कृतम्)</option>
                    <option value="es-ES">Spanish</option>
                    <option value="fr-FR">French</option>
                    <option value="ar-SA">Arabic</option>
                </select>
                <textarea id="output-text" placeholder="Translation will appear here..." readonly></textarea>
                <div class="controls">
                    <button class="icon-btn" id="speak-target" title="Listen">🔊</button>
                    <button class="icon-btn" id="copy-btn" title="Copy Text">📋</button>
                </div>
            </div>
        </div>

        <button class="translate-btn" id="translate-btn">Translate Text</button>
    </div>

    <footer class="footer">
        <p>© Copyright shivamheloo.com</p>
    </footer>

    <script>
        function updateTime() {
            const timeElement = document.getElementById('live-time');
            const now = new Date();
            const options = { 
                weekday: 'long', year: 'numeric', month: 'short', day: 'numeric', 
                hour: '2-digit', minute: '2-digit', second: '2-digit' 
            };
            timeElement.textContent = "🕒 Current Time: " + now.toLocaleString('en-IN', options);
        }
        setInterval(updateTime, 1000);
        updateTime(); 

        const modal = document.getElementById('welcome-modal');
        const mainContent = document.getElementById('main-content');
        const modalOkBtn = document.getElementById('modal-ok');

        modalOkBtn.addEventListener('click', () => {
            modal.classList.add('hide-modal');
            mainContent.classList.remove('disable-interaction');
        });

        const inputText = document.getElementById('input-text');
        const outputText = document.getElementById('output-text');
        const sourceLang = document.getElementById('source-lang');
        const targetLang = document.getElementById('target-lang');
        const translateBtn = document.getElementById('translate-btn');
        const copyBtn = document.getElementById('copy-btn');
        const speakSourceBtn = document.getElementById('speak-source');
        const speakTargetBtn = document.getElementById('speak-target');

        translateBtn.addEventListener('click', () => {
            let text = inputText.value.trim();
            let translateFrom = sourceLang.value;
            let translateTo = targetLang.value;
            
            if (!text) return;

            outputText.value = "Translating...";
            
            let fromCode = translateFrom.split('-')[0];
            let toCode = translateTo.split('-')[0];
            
            // Google API Request
            let encodedText = encodeURIComponent(text);
            let apiUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${fromCode}&tl=${toCode}&dt=t&q=${encodedText}`;

            fetch(apiUrl)
                .then(res => res.json())
                .then(data => {
                    let translatedText = '';
                    if (data && data[0]) {
                        data[0].forEach(item => {
                            if (item[0]) {
                                translatedText += item[0];
                            }
                        });
                        outputText.value = translatedText;
                    } else {
                        outputText.value = "Error: Invalid Response from Server";
                    }
                })
                .catch(err => {
                    outputText.value = "Error: Could not translate right now.";
                    console.error(err);
                });
        });

        copyBtn.addEventListener('click', () => {
            if (outputText.value) {
                navigator.clipboard.writeText(outputText.value);
                alert("Translation copied to clipboard!");
            }
        });

        function speakText(text, lang) {
            if (!text) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            window.speechSynthesis.speak(utterance);
        }

        speakSourceBtn.addEventListener('click', () => {
            speakText(inputText.value, sourceLang.value);
        });

        speakTargetBtn.addEventListener('click', () => {
            speakText(outputText.value, targetLang.value);
        });
    </script>
</body>
</html>
